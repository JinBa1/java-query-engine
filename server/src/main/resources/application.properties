# cuckooDB REST gateway configuration. Every value here is a conservative default; override
# per deployment via environment variables or an external application.properties.

# --- Catalog ---
# Directory whose data/ subdir is loaded into the catalog at startup. Empty = uploads only.
cuckoodb.data-dir=
# Where uploaded CSVs are persisted for the process lifetime. MUST NOT be an auto-deleted temp
# dir: joins re-open table files on every scan, so the backing file must survive the request.
cuckoodb.work-dir=${java.io.tmpdir}/cuckoodb-work

# --- Query budgets (always attached; the engine has no default = unlimited) ---
cuckoodb.query.max-tuples-default=100000
cuckoodb.query.max-tuples-cap=1000000
cuckoodb.query.timeout-ms-default=5000
cuckoodb.query.timeout-ms-cap=30000

# --- Concurrency (CPU-bound engine) ---
# Blank/absent => Runtime.availableProcessors().
cuckoodb.max-concurrent-queries=

# --- Upload (write surface; closed by default until a later governance phase enables it) ---
cuckoodb.upload.enabled=false
cuckoodb.upload.max-bytes=10485760
cuckoodb.upload.max-tables=100

# --- Container limits cohere with the budgets above ---
# The real upload size cap is enforced by the controller WHILE streaming the body (-> 413).
# These are only coarse container backstops. NOTE: spring.servlet.multipart.* does NOT apply to
# this endpoint, which consumes raw text/csv via getInputStream(), not multipart/form-data.
server.tomcat.max-swallow-size=50MB
# Keep the connection timeout above the time-budget cap so a slow query surfaces as a clean
# 504/429 rather than a container-level reset.
server.tomcat.connection-timeout=35s

# OpenAPI / Swagger UI
springdoc.swagger-ui.path=/swagger-ui.html

# --- MCP server (agent tool surface over the query gateway) ---
# Streamable HTTP transport, SYNC tools, served at /mcp. These are mostly the Spring AI 2.x
# defaults, set explicitly to document the contract and pin it against future default changes.
# SSE is deliberately NOT used: it is deprecated in 2.0 and had a 0-bytes bug on Boot 4 / Tomcat 11.
# The @McpTool methods on CuckooMcpTools are auto-registered by the annotation scanner (default on);
# no ToolCallbackProvider bean is declared (that is the legacy @Tool path and would fail startup).
spring.ai.mcp.server.protocol=STREAMABLE
spring.ai.mcp.server.type=SYNC
spring.ai.mcp.server.name=cuckoodb
spring.ai.mcp.server.version=1.0.0
spring.ai.mcp.server.streamable-http.mcp-endpoint=/mcp
